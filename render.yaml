services:
  - type: web
    name: vajrakavach-2070-mvp
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python3 -m unittest discover -s tests -v"
    startCommand: "python3 -m backend.app"
    envVars:
      - key: VAJRA_HOST
        value: 0.0.0.0
      - key: VAJRA_PORT
        value: 10000
      - key: VAJRA_SECRET_KEY
        generateValue: true
